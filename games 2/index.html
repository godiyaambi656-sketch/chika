<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fun Game World</title>

<style>

body{
background:#0f172a;
color:white;
text-align:center;
font-family:Arial;
}

h1{
margin-top:20px;
}

button{
padding:12px 25px;
margin:10px;
font-size:16px;
border:none;
border-radius:8px;
cursor:pointer;
background:#22c55e;
color:white;
}

button:hover{
background:#16a34a;
}

canvas{
background:white;
margin-top:20px;
display:none;
}

#clickGame{
display:none;
margin-top:20px;
}

#reactionGame{
display:none;
margin-top:20px;
}

#reactionBox{
width:200px;
height:200px;
background:red;
margin:auto;
cursor:pointer;
}

</style>

</head>

<body>

<h1>🎮 Fun Game World</h1>
<p>Select a Game</p>

<button onclick="startShapeGame()">Shape Animation</button>
<button onclick="startClickGame()">Click Speed Game</button>
<button onclick="startReactionGame()">Reaction Game</button>

<canvas id="gameCanvas" width="400" height="400"></canvas>

<div id="clickGame">
<p>Click the button as fast as you can!</p>
<button onclick="increaseScore()">CLICK ME</button>
<h2 id="score">Score: 0</h2>
</div>

<div id="reactionGame">
<p>Wait for the box to turn GREEN then click!</p>

<div id="reactionBox"></div>

<h2 id="reactionResult"></h2>
</div>

<script>

/* ------------------ CLICK GAME ------------------ */

let score = 0;

function startClickGame(){

document.getElementById("clickGame").style.display="block";
document.getElementById("gameCanvas").style.display="none";
document.getElementById("reactionGame").style.display="none";

}

function increaseScore(){

score++;

document.getElementById("score").innerText =
"Score: " + score;

}

/* ------------------ SHAPE GAME ------------------ */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let x = 50;
let y = 200;
let dx = 3;
let shape = 0;

function startShapeGame(){

document.getElementById("gameCanvas").style.display="block";
document.getElementById("clickGame").style.display="none";
document.getElementById("reactionGame").style.display="none";

}

function drawShape(){

ctx.clearRect(0,0,400,400);

ctx.fillStyle =
"rgb("+
Math.floor(Math.random()*255)+","+
Math.floor(Math.random()*255)+","+
Math.floor(Math.random()*255)+")";

if(shape === 0){

ctx.beginPath();
ctx.arc(x,y,30,0,Math.PI*2);
ctx.fill();

}

else if(shape === 1){

ctx.fillRect(x-30,y-30,60,60);

}

else{

ctx.beginPath();
ctx.moveTo(x,y-30);
ctx.lineTo(x-30,y+30);
ctx.lineTo(x+30,y+30);
ctx.closePath();
ctx.fill();

}

x += dx;

if(x > 350 || x < 50){

dx = -dx;

}

}

setInterval(drawShape,500);

setInterval(function(){

shape++;

if(shape > 2){

shape = 0;

}

},2000);

/* ------------------ REACTION GAME ------------------ */

let startTime;

function startReactionGame(){

document.getElementById("reactionGame").style.display="block";
document.getElementById("clickGame").style.display="none";
document.getElementById("gameCanvas").style.display="none";

startReaction();

}

function startReaction(){

let delay = Math.random() * 3000 + 2000;

setTimeout(function(){

let box = document.getElementById("reactionBox");

box.style.background = "green";

startTime = Date.now();

}, delay);

}

document.getElementById("reactionBox").onclick = function(){

let endTime = Date.now();

let reactionTime = (endTime - startTime) / 1000;

document.getElementById("reactionResult").innerText =
"Your reaction time: " + reactionTime + " seconds";

this.style.background = "red";

startReaction();

}

</script>

</body>
</html>

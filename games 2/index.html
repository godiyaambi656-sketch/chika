<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fun Game World</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

header{
  background:#020617;
  padding:20px;
  font-size:24px;
}

.games{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  padding:40px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:10px;
  width:220px;
  cursor:pointer;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
  background:#334155;
}

canvas{
  background:white;
  margin-top:20px;
  display:none;
}

#clickGame, #reactionGame, #leaderboard{
  display:none;
  margin-top:20px;
}

#reactionBox{
  width:200px;
  height:200px;
  background:red;
  margin:auto;
  cursor:pointer;
}

button{
  padding:12px 25px;
  margin-top:10px;
  border:none;
  background:#22c55e;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

ul{
  text-align:left;
  display:inline-block;
  padding-left:20px;
}
</style>
</head>

<body>

<header>
🎮 Fun Game World
</header>

<h2>Select a Game</h2>

<div class="games">
  <div class="card" onclick="startShapeGame()">
    <h3>Shape Animation</h3>
    <p>Watch shapes move and change colors</p>
  </div>

  <div class="card" onclick="startClickGame()">
    <h3>Click Speed</h3>
    <p>Click as fast as possible</p>
  </div>

  <div class="card" onclick="startReactionGame()">
    <h3>Reaction Game</h3>
    <p>Test your reaction speed</p>
  </div>
</div>

<canvas id="gameCanvas" width="400" height="400"></canvas>

<div id="clickGame">
  <p>Click the button as fast as you can!</p>
  <button onclick="increaseScore()">CLICK ME</button>
  <h2 id="score">Score: 0</h2>
</div>

<div id="reactionGame">
  <p>Wait for the box to turn GREEN then click!</p>
  <div id="reactionBox"></div>
  <h2 id="reactionResult"></h2>
</div>

<div id="leaderboard">
  <h2>Leaderboard</h2>
  <ul id="leaderboardList"></ul>
</div>

<script>
// ------------------- Firebase Setup -------------------
const firebaseConfig = {
  apiKey: "AIzaSyAaxxizHNIs2Pxd03T4f_YqBHjUDjDncqg",
  authDomain: "treasure-click-battle.firebaseapp.com",
  databaseURL: "https://treasure-click-battle-default-rtdb.firebaseio.com",
  projectId: "treasure-click-battle",
  storageBucket: "treasure-click-battle.firebasestorage.app",
  messagingSenderId: "505994311069",
  appId: "1:505994311069:web:64184ee02359edd0c92b74",
  measurementId: "G-R5JF71ESJH"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const leaderboardList = document.getElementById("leaderboardList");

// ------------------- Hide All Games -------------------
function hideAll(){
  document.getElementById("gameCanvas").style.display="none";
  document.getElementById("clickGame").style.display="none";
  document.getElementById("reactionGame").style.display="none";
  document.getElementById("leaderboard").style.display="none";
}

// ------------------- Shape Animation Game -------------------
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let x = 50, y = 200, dx = 3, shape = 0;

function startShapeGame(){
  hideAll();
  canvas.style.display="block";
}

function drawShape(){
  ctx.clearRect(0,0,400,400);
  ctx.fillStyle = `rgb(${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)})`;

  if(shape===0){
    ctx.beginPath();
    ctx.arc(x,y,30,0,Math.PI*2);
    ctx.fill();
  } else if(shape===1){
    ctx.fillRect(x-30,y-30,60,60);
  } else {
    ctx.beginPath();
    ctx.moveTo(x,y-30);
    ctx.lineTo(x-30,y+30);
    ctx.lineTo(x+30,y+30);
    ctx.closePath();
    ctx.fill();
  }

  x += dx;
  if(x > 350 || x < 50) dx = -dx;
}

setInterval(drawShape,500);
setInterval(()=>{ shape = (shape+1)%3; },2000);

// ------------------- Click Game -------------------
let score = 0;

function startClickGame(){
  hideAll();
  document.getElementById("clickGame").style.display="block";
  document.getElementById("leaderboard").style.display="block";
}

function increaseScore(){
  score++;
  document.getElementById("score").innerText = "Score: " + score;

  const playerName = prompt("Enter your name for leaderboard:","Player1");
  if(playerName){
    database.ref('clickGameScores/'+playerName).set({score:score});
  }
}

// ------------------- Reaction Game -------------------
let startTime;

function startReactionGame(){
  hideAll();
  document.getElementById("reactionGame").style.display="block";
  document.getElementById("leaderboard").style.display="block";
  startReaction();
}

function startReaction(){
  let delay = Math.random()*3000+2000;
  setTimeout(()=>{
    document.getElementById("reactionBox").style.background="green";
    startTime = Date.now();
  }, delay);
}

document.getElementById("reactionBox").onclick = function(){
  let endTime = Date.now();
  let reactionTime = ((endTime - startTime)/1000).toFixed(3);
  document.getElementById("reactionResult").innerText = "Reaction Time: "+reactionTime+" seconds";
  this.style.background="red";
  startReaction();
}

// ------------------- Global Leaderboard -------------------
database.ref('clickGameScores').on('value', (snapshot)=>{
  const data = snapshot.val();
  leaderboardList.innerHTML = '';
  if(data){
    const scores = Object.entries(data).sort((a,b)=>b[1].score - a[1].score);
    scores.forEach(([name, value])=>{
      const li = document.createElement('li');
      li.innerText = `${name}: ${value.score}`;
      leaderboardList.appendChild(li);
    });
  }
});
</script>

</body>
</html>
